name: Build and publish

# Build-and-publish only, no deploy job: this is a `singleton` in the infra
# registry - no colour slots, no route, no published port - so the blue-green
# deploy machinery does not apply. The host pins a tag in its Quadlet.
#
# No test job either, deliberately. package.json's test script is the npm
# default stub (`echo "Error: no test specified" && exit 1`), so a test gate
# here would fail every build while proving nothing. `tsc` running inside the
# image build is the real check: it will not produce lib/ if the source does
# not typecheck.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - uses: docker/setup-buildx-action@v3

      - name: Generate CalVer
        id: calver
        run: |
          echo "version=$(date +'%y.%m.%d').$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # A fork's PR must not be able to publish an image the hosts pull.
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=v${{ steps.calver.outputs.version }}
          tags: |
            ghcr.io/ollisulopuisto/slack-archive:latest
            ghcr.io/ollisulopuisto/slack-archive:${{ steps.calver.outputs.version }}
            ghcr.io/ollisulopuisto/slack-archive:${{ steps.calver.outputs.sha7 }}

  # The arm64 half, native, on a GitHub-hosted ARM runner.
  #
  # This replaced QEMU emulation on 2026-08-21. Emulating was never the right
  # answer here - this image compiles sqlite3 from source through node-gyp and
  # runs a full tsc build, which is the worst possible workload to emulate - but
  # it looked like the only one, because this repo is PUBLIC and so gets no
  # self-hosted runner (anyone can open a pull request, and our runner shares a
  # disk with production secrets; agents.md 6b).
  #
  # ubuntu-24.04-arm is the third option: native aarch64, and free for public
  # repositories. Being public costs this repo the self-hosted runner and then
  # hands back something better.
  build-arm64:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for `cache-to: type=gha`. Without it buildx uses the default
      # `docker` driver, which cannot export a cache, and the build dies at the
      # end of setup with "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - name: Same CalVer as build-and-push
        id: calver
        run: echo "version=$(date +'%y.%m.%d').$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # No platforms: and no QEMU - the runner IS aarch64.
      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            APP_VERSION=v${{ steps.calver.outputs.version }}
          tags: ghcr.io/ollisulopuisto/slack-archive:${{ steps.calver.outputs.version }}-arm64

      # Replace the tags the host pins with manifest lists CONTAINING the amd64
      # images build-and-push already pushed, so an x86 host rolling back
      # resolves to the identical digest it had before.
      - name: Publish multi-arch manifests
        env:
          VER: ${{ steps.calver.outputs.version }}
        run: |
          for TAG in "$VER" latest; do
            docker buildx imagetools create \
              --tag "ghcr.io/ollisulopuisto/slack-archive:$TAG" \
              "ghcr.io/ollisulopuisto/slack-archive:$VER" \
              "ghcr.io/ollisulopuisto/slack-archive:$VER-arm64"
            echo "published multi-arch :$TAG"
          done
