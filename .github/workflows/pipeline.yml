name: Build and publish

# Build-and-publish only, no deploy job: this is a `singleton` in the infra
# registry - no colour slots, no route, no published port - so the blue-green
# deploy machinery does not apply. The host pins a tag in its Quadlet.
#
# The test job exists as of 26.08.25.131. It did not before, and the reason it
# did not was accurate at the time: package.json's test script was the npm
# default stub, so a gate here would have failed every build while proving
# nothing. There is a real vitest suite now - it covers the search query
# parsing and the FTS5 database the bot answers from - so the gate proves
# something. `tsc` inside the image build still typechecks; that has not moved.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # `npm ci` runs `prepare` (tsc), so this typechecks before it tests.
      - run: npm ci
      - run: npm test
      # vitest transforms the source; it does not prove the EMITTED ESM in lib/
      # loads. It does not: node-sqlite3-wasm is CommonJS, and `import
      # { Database } from` it typechecks, passes vitest, and then throws
      # "does not provide an export named 'Database'" the first time the
      # container runs bot mode. This step is the one that catches that.
      - run: npm run smoke

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      publish_version: ${{ steps.calver.outputs.publish_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - uses: docker/setup-buildx-action@v3

      - name: Generate CalVer
        id: calver
        env:
          # The probe reads the package to see whether this version already
          # exists. Four of five packages here are PRIVATE, and ghcr answers an
          # anonymous probe of a private package with 401 - no token, no probe,
          # version tag withheld on every run, forever, with the run still green.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Read, not computed: scripts/release_version.sh takes the top
          # CHANGELOG heading and exits non-zero rather than inventing a name.
          # `git rev-list --count HEAD` is derived - a squash merge moves it by
          # an amount unrelated to what shipped, a rebase changes it wholesale,
          # and two parallel branches produce the same count. Kept alongside a
          # hand-written CHANGELOG the two drift; five of eight repos here were
          # drifting on 2026-08-22.
          #
          # release_tags.sh also decides whether this build may CLAIM the
          # version tag. Under the old count scheme every push to main produced
          # a different number, so a version tag could never be reused. A
          # declared version removes that: a docs-only push re-reads the same
          # heading and would republish an already-claimed tag with different
          # bits. It ships :latest and :sha7 instead, and says so in the summary.
          bash scripts/release_tags.sh ghcr.io/ollisulopuisto/slack-archive

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # A fork's PR must not be able to publish an image the hosts pull.
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=v${{ steps.calver.outputs.version }}
          tags: ${{ steps.calver.outputs.tags }}

  # The arm64 half, native, on a GitHub-hosted ARM runner.
  #
  # This replaced QEMU emulation on 2026-08-21. Emulating was never the right
  # answer here - the image ran a full tsc build and, at the time, compiled
  # sqlite3 from source through node-gyp, which is the worst possible workload
  # to emulate - but it looked like the only one, because this repo is PUBLIC
  # and so gets no
  # self-hosted runner (anyone can open a pull request, and our runner shares a
  # disk with production secrets; agents.md 6b).
  #
  # ubuntu-24.04-arm is the third option: native aarch64, and free for public
  # repositories. Being public costs this repo the self-hosted runner and then
  # hands back something better.
  build-arm64:
    needs: build-and-push
    # Also gated on the version being NEW. This leg's whole output is folded
    # into the multi-arch manifest under :VERSION, so running it for a version
    # that already exists would republish that manifest with different bits -
    # exactly the overwrite build-and-push now refuses. Skipping it leaves the
    # published multi-arch image intact.
    if: github.event_name != 'pull_request' && needs.build-and-push.outputs.publish_version == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for `cache-to: type=gha`. Without it buildx uses the default
      # `docker` driver, which cannot export a cache, and the build dies at the
      # end of setup with "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - name: Same CalVer as build-and-push
        id: calver
        # Same source as build-and-push, and that is the point: both legs of a
        # multi-arch build must name one version. When each computed its own
        # from `git rev-list --count HEAD` they agreed only because they ran on
        # the same commit - and the date part could still differ across a UTC
        # midnight, tagging the two halves of one image differently.
        run: echo "version=$(bash scripts/release_version.sh)" >> "$GITHUB_OUTPUT"

      # No platforms: and no QEMU - the runner IS aarch64.
      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            APP_VERSION=v${{ steps.calver.outputs.version }}
          tags: ghcr.io/ollisulopuisto/slack-archive:${{ steps.calver.outputs.version }}-arm64

      # Replace the tags the host pins with manifest lists CONTAINING the amd64
      # images build-and-push already pushed, so an x86 host rolling back
      # resolves to the identical digest it had before.
      - name: Publish multi-arch manifests
        env:
          VER: ${{ steps.calver.outputs.version }}
        run: |
          for TAG in "$VER" latest; do
            docker buildx imagetools create \
              --tag "ghcr.io/ollisulopuisto/slack-archive:$TAG" \
              "ghcr.io/ollisulopuisto/slack-archive:$VER" \
              "ghcr.io/ollisulopuisto/slack-archive:$VER-arm64"
            echo "published multi-arch :$TAG"
          done
