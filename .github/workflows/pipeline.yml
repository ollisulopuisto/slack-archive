name: Build and publish

# Build-and-publish only, no deploy job: this is a `singleton` in the infra
# registry - no colour slots, no route, no published port - so the blue-green
# deploy machinery does not apply. The host pins a tag in its Quadlet.
#
# No test job either, deliberately. package.json's test script is the npm
# default stub (`echo "Error: no test specified" && exit 1`), so a test gate
# here would fail every build while proving nothing. `tsc` running inside the
# image build is the real check: it will not produce lib/ if the source does
# not typecheck.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emulation for the arm64 leg, and here that is the right call rather
      # than a compromise. This repository is PUBLIC, so anyone can open a pull
      # request - which is exactly why it has no self-hosted runner, and why the
      # native ARM box that builds backlog is not an option for this image.
      # Public repositories are also discounted separately from the account
      # allowance, so the slow emulated leg is free where a private repo's would
      # not be. It is slow: sqlite3 compiles from source and the whole
      # devDependency tree installs for the tsc build.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Generate CalVer
        id: calver
        run: |
          echo "version=$(date +'%y.%m.%d').$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # oraakkeli3 is an Ampere A1, so this image must exist for aarch64.
          # One tag, both arches, as a manifest list - each host resolves its own.
          platforms: linux/amd64,linux/arm64
          # A fork's PR must not be able to publish an image the hosts pull.
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=v${{ steps.calver.outputs.version }}
          tags: |
            ghcr.io/ollisulopuisto/slack-archive:latest
            ghcr.io/ollisulopuisto/slack-archive:${{ steps.calver.outputs.version }}
            ghcr.io/ollisulopuisto/slack-archive:${{ steps.calver.outputs.sha7 }}
