  <body>
    <!-- Only JSX is compiled here. The rest of this file is left as written,
         so async/await reaches the browser as async/await rather than through
         a 2016 transform that would need a regenerator runtime to land. -->
    <script type="text/babel" data-presets="react">
      // How much of the database one page-load may pull down before it gives
      // up. Every query it can answer reads a few hundred kilobytes; anything
      // approaching this means a query fell back to scanning, and a phone on
      // cellular should be told rather than billed.
      const MAX_BYTES = 64 * 1024 * 1024;

      // Big enough that one request covers several pages of the database,
      // small enough that a query is not a download.
      const CHUNK = 4096;

      /**
       * A date from a picker as epoch seconds, in the reader's own timezone.
       *
       * `new Date("2025-01-01")` is midnight UTC, which is the previous evening
       * in Helsinki - a message sent at 01:30 would fall outside a range that
       * visibly includes its day. Constructed from the parts instead, which is
       * local by definition.
       */
      function startOfDay(value, addDays = 0) {
        if (!value) return undefined;

        const [year, month, day] = value.split("-").map(Number);
        if (!year || !month || !day) return undefined;

        return Math.floor(
          new Date(year, month - 1, day + addDays).getTime() / 1000,
        );
      }

      class App extends React.PureComponent {
        constructor(props) {
          super(props);

          this.handleSearchChange = this.handleSearchChange.bind(this);
          this.handleSearchClear = this.handleSearchClear.bind(this);
          this.handleChannelChange = this.handleChannelChange.bind(this);
          this.handleUserChange = this.handleUserChange.bind(this);
          this.handleFromChange = this.handleFromChange.bind(this);
          this.handleToChange = this.handleToChange.bind(this);

          this.searchInputRef = React.createRef();
          // Queries are answered over the network now, so they come back out
          // of order. Only the newest one is allowed to render.
          this.queryId = 0;
          this.pending = null;

          // A search box lives in the sidebar of every page and hands the
          // query over here: search.html?q=...
          const query = new URLSearchParams(window.location.search).get("q");

          this.state = {
            matchingMessages: [],
            searchValue: query || "",
            selectedChannel: "",
            selectedUser: "",
            fromDate: "",
            toDate: "",
            ready: false,
            searching: false,
            error: null,
            channels: {},
            users: {},
          };
        }

        componentDidMount() {
          const built = window.SEARCH_INDEXES || { db: true, js: false };
          // ?index=js or ?index=db forces one of them, which is how you find
          // out whether a slow search is the index or the archive.
          const forced = new URLSearchParams(window.location.search).get(
            "index",
          );

          if (forced === "js" && built.js) return this.loadJsIndex("asked for");
          if (forced === "db" && built.db) return this.openDatabase();

          // A database read over range requests cannot be read from file://:
          // there are no range requests there, and a worker loaded from file://
          // is refused. So an archive opened as a folder of files uses the
          // JavaScript index, if it was built - and an archive served over
          // HTTP uses the database, which is what makes it work on a phone.
          if (built.db && window.location.protocol !== "file:") {
            this.openDatabase();
          } else if (built.js) {
            this.loadJsIndex(
              built.db
                ? "opened from a folder rather than served, so the database index cannot be read"
                : null,
            );
          } else {
            this.setState({
              error:
                "this archive was built with --search-index db, and a database index needs to be served over HTTP rather than opened as a file",
            });
          }
        }

        /**
         * The whole corpus in one script tag, indexed here in the browser.
         *
         * What every archive did until the database arrived, kept because it
         * is the only thing that works from file:// - and it is exactly why
         * the search page died on a phone, so it is no longer what a served
         * archive uses.
         */
        loadJsIndex(reason) {
          if (reason) console.info(`Using the JavaScript index: ${reason}`);

          if (!window.search_data) {
            setTimeout(() => this.loadJsIndex(null), 100);
            return;
          }

          const { messages, channels, users, pages } = window.search_data;
          const allMessages = [];

          for (const channel in messages) {
            for (const message of messages[channel]) {
              allMessages.push(
                Object.assign({}, message, {
                  c: channel,
                  id: `${channel}-${message.t}`,
                }),
              );
            }
          }

          const miniSearch = new MiniSearch({
            idField: "id",
            fields: ["m"],
            storeFields: ["t", "u", "m", "c", "p"],
          });
          miniSearch.addAll(allMessages);

          this.miniSearch = miniSearch;
          this.pages = pages;
          this.setState({ ready: true, channels, users }, () => {
            if (this.state.searchValue) this.updateResults();
          });
        }

        /** The same rows the database returns, from the JavaScript index. */
        searchJsIndex(text, channel, user, after, before) {
          const { cleanQuery, phrases } = parseSearchQuery(text);
          const options = { combineWith: "AND", prefix: true };
          const filter = getSearchFilter({ channel, user });

          if (filter) options.filter = filter;

          let results;
          if (cleanQuery) {
            results = this.miniSearch.search(cleanQuery, options);
          } else if (channel || user || after || before) {
            results = this.miniSearch.search(MiniSearch.wildcard, options);
          } else {
            results = [];
          }

          // The dates are applied AFTER the index, not inside it: MiniSearch
          // holds no timestamps to filter on. Slicing to fifty happens after
          // this, or a narrow range would come back empty because the first
          // fifty hits all fell outside it.
          if (after || before) {
            results = results.filter((result) => {
              const seconds = Number(result.t);
              if (after && seconds < after) return false;
              if (before && seconds >= before) return false;
              return true;
            });
          }

          return filterResultsByPhrases(results, phrases)
            .slice(0, 50)
            .map((result) => {
              // The page index holds top-level timestamps only, so a reply is
              // found by its parent's - the same rule the database applies in
              // SQL, spelled out here.
              const channelPages = this.pages[result.c] || null;
              const lookup = result.p || result.t;
              const index = channelPages
                ? channelPages.findIndex((pageTs) => pageTs < lookup)
                : -1;

              return {
                id: result.id,
                c: result.c,
                u: result.u,
                t: result.t,
                p: result.p,
                m_text: result.m,
                page: index < 0 ? 0 : index,
              };
            });
        }

        async openDatabase() {
          try {
            const worker = await createDbWorker(
              [
                {
                  from: "inline",
                  config: {
                    serverMode: "full",
                    url: new URL("data/search.db", document.baseURI).href,
                    requestChunkSize: CHUNK,
                  },
                },
              ],
              // Absolute, because the worker resolves the wasm against its
              // OWN location and would otherwise ask for html/html/...
              new URL("html/sqlite.worker.js", document.baseURI).href,
              new URL("html/sql-wasm.wasm", document.baseURI).href,
              MAX_BYTES,
            );

            // Two small tables, read once: everything else is read a few
            // pages at a time, when a query asks for it.
            const channelRows = await worker.db.query(
              "select id, name from channels order by name",
            );
            const userRows = await worker.db.query(
              "select id, name from users order by name",
            );

            const channels = {};
            for (const row of channelRows) channels[row.id] = row.name;
            const users = {};
            for (const row of userRows) users[row.id] = row.name;

            this.worker = worker;
            this.setState({ ready: true, channels, users }, () => {
              if (this.state.searchValue) this.updateResults();
            });
          } catch (error) {
            console.error("could not open the search database", error);

            // A server that does not answer range requests, or a database that
            // was never uploaded. If the whole-corpus index is here, it still
            // answers - slowly, but it answers.
            if ((window.SEARCH_INDEXES || {}).js) {
              this.loadJsIndex("the database could not be opened");
              return;
            }

            this.setState({ error: String((error && error.message) || error) });
          }
        }

        handleSearchChange({ target: { value } }) {
          this.setState({ searchValue: value }, () => {
            // Typing is not a query. Each keystroke would otherwise be its own
            // set of range requests, and the answer to a half-typed word is
            // never the one anybody wanted.
            clearTimeout(this.pending);
            this.pending = setTimeout(() => this.updateResults(), 250);
          });
        }

        handleChannelChange({ target: { value } }) {
          this.setState({ selectedChannel: value }, () => this.updateResults());
        }

        handleUserChange({ target: { value } }) {
          this.setState({ selectedUser: value }, () => this.updateResults());
        }

        handleFromChange({ target: { value } }) {
          this.setState({ fromDate: value }, () => this.updateResults());
        }

        handleToChange({ target: { value } }) {
          this.setState({ toDate: value }, () => this.updateResults());
        }

        handleSearchClear() {
          clearTimeout(this.pending);
          this.queryId++;
          this.setState({
            searchValue: "",
            matchingMessages: [],
            selectedChannel: "",
            selectedUser: "",
            fromDate: "",
            toDate: "",
            searching: false,
          });
        }

        async updateResults() {
          const {
            searchValue,
            selectedChannel,
            selectedUser,
            fromDate,
            toDate,
          } = this.state;
          const text = searchValue.trim();
          // A date is a day on somebody's calendar, and which day it is depends
          // on the clock. These are read in the reader's own timezone, which is
          // the one the timestamps beside the results are printed in - anything
          // else would put a message on a different day than the page shows it.
          const after = startOfDay(fromDate);
          const before = startOfDay(toDate, 1);
          const query = buildSearchSql({
            query: text.length > 1 ? text : "",
            channel: selectedChannel,
            user: selectedUser,
            after,
            before,
          });

          if (!query || (!this.worker && !this.miniSearch)) {
            this.setState({ matchingMessages: [], searching: false });
            return;
          }

          const id = ++this.queryId;
          this.setState({ searching: true });

          try {
            const rows = this.worker
              ? await this.worker.db.query(query.sql, query.params)
              : this.searchJsIndex(
                  text.length > 1 ? text : "",
                  selectedChannel,
                  selectedUser,
                  after,
                  before,
                );

            // A slower earlier query must not overwrite a faster later one.
            if (id !== this.queryId) return;

            this.setState({ matchingMessages: rows, searching: false });
          } catch (error) {
            if (id !== this.queryId) return;

            console.error("search failed", error);
            this.setState({
              matchingMessages: [],
              searching: false,
              error: String((error && error.message) || error),
            });
          }
        }

        render() {
          const {
            matchingMessages,
            searchValue,
            selectedChannel,
            selectedUser,
            fromDate,
            toDate,
            ready,
            searching,
            error,
            channels,
            users,
          } = this.state;

          if (error) {
            return (
              <div className="App">
                <article className="main">
                  <p className="search-error">
                    The search database could not be read: {error}
                  </p>
                  <p>
                    Every message is still on the channel pages; only the search
                    box needs it.
                  </p>
                </article>
              </div>
            );
          }

          const asked =
            searchValue ||
            selectedChannel ||
            selectedUser ||
            fromDate ||
            toDate;

          return (
            <div className="App">
              <article className="main">
                {ready ? (
                  <Header
                    onChange={this.handleSearchChange}
                    onChannelChange={this.handleChannelChange}
                    onUserChange={this.handleUserChange}
                    onFromChange={this.handleFromChange}
                    onToChange={this.handleToChange}
                    onSearchClear={this.handleSearchClear}
                    value={searchValue}
                    selectedChannel={selectedChannel}
                    selectedUser={selectedUser}
                    fromDate={fromDate}
                    toDate={toDate}
                    searchInputRef={this.searchInputRef}
                    channels={channels}
                    users={users}
                  />
                ) : (
                  <p>Opening the search index…</p>
                )}
                {matchingMessages.length > 0 ? (
                  <MessagesList
                    messages={matchingMessages}
                    channels={channels}
                    users={users}
                  />
                ) : (
                  <p>
                    {searching
                      ? "Searching…"
                      : asked
                        ? "No matches found."
                        : "Start typing to search messages."}
                  </p>
                )}
              </article>
            </div>
          );
        }
      }

      const MessagesList = ({ messages, channels, users }) => (
        <ul className="MessagesList">
          {messages.map((message) => (
            <Message
              key={message.id}
              message={message}
              channels={channels}
              users={users}
            />
          ))}
        </ul>
      );

      const Message = ({ message, channels, users }) => {
        // The page a result is on comes from the database, which knows the
        // page ranges - and knows that a thread reply is rendered inside its
        // parent's block, so it is the parent's page that holds it.
        const page = message.page === null ? 0 : message.page;
        const href = `html/${message.c}-${page}.html#${message.t}`;

        return (
          <a href={href} target="_blank">
            <li className="Message">
              <p>
                <span className="Channel">#{channels[message.c]}</span> -{" "}
                <Timestamp timestamp={message.t} />
              </p>
              <p>
                <strong>@{users[message.u] || message.u}: </strong>
                {message.m_text}
              </p>
            </li>
          </a>
        );
      };

      const Timestamp = ({ timestamp }) => {
        const splitTs = timestamp.split(".") || [];
        const jsTs = parseInt(
          `${splitTs[0]}${(splitTs[1] || "000").slice(0, 3)}`,
          10,
        );
        const date = new Date(jsTs);

        return (
          <span className="timestamp">
            <span className="c-timestamp__label">{date.toLocaleString()}</span>
          </span>
        );
      };

      const Header = (props) => (
        <header className="Header">
          <h1>Message Search</h1>
          <SearchBox {...props} />
        </header>
      );

      const SearchBox = ({
        onChange,
        onChannelChange,
        onUserChange,
        onFromChange,
        onToChange,
        onSearchClear,
        value,
        selectedChannel,
        selectedUser,
        fromDate,
        toDate,
        searchInputRef,
        channels,
        users,
      }) => {
        const sortedChannels = Object.entries(channels).sort((a, b) =>
          a[1].localeCompare(b[1]),
        );
        const sortedUsers = Object.entries(users).sort((a, b) =>
          a[1].localeCompare(b[1]),
        );

        return (
          <div className="SearchBox">
            <div className="Search">
              <input
                type="text"
                value={value}
                onChange={onChange}
                ref={searchInputRef}
                placeholder="Search messages..."
                autoComplete="none"
                autoCorrect="none"
                autoCapitalize="none"
                spellCheck="false"
              />
              <button className="clear" onClick={onSearchClear}>
                &times;
              </button>
            </div>
            <div className="Filters">
              <select value={selectedChannel} onChange={onChannelChange}>
                <option value="">All Channels</option>
                {sortedChannels.map(([id, name]) => (
                  <option key={id} value={id}>
                    #{name}
                  </option>
                ))}
              </select>
              <select value={selectedUser} onChange={onUserChange}>
                <option value="">All Users</option>
                {sortedUsers.map(([id, name]) => (
                  <option key={id} value={id}>
                    @{name}
                  </option>
                ))}
              </select>
              <label className="DateFilter">
                <span>From</span>
                <input type="date" value={fromDate} onChange={onFromChange} />
              </label>
              <label className="DateFilter">
                <span>To</span>
                <input type="date" value={toDate} onChange={onToChange} />
              </label>
            </div>
          </div>
        );
      };

      ReactDOM.render(
        React.createElement(App),
        document.getElementById("search"),
      );
    </script>
    <div id="index">
      <!-- sidebar -->
      <main id="messages">
        <div id="search">
          Opening the search index…
          <p>
            <!-- Size -->
          </p>
        </div>
      </main>
    </div>
    <!-- search-data -->
    <script defer src="html/sidebar.js"></script>
  </body>
</html>
